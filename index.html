<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXO</title>
<style>
  /* ============ RÉGLAGES RAPIDES ============
     Change juste ces deux lignes pour ta config :
     - INTRO_VIDEO_URL : le lien direct vers ta vidéo (mp4)
     - API_URL est plus bas dans le <script>
  =========================================== */

  :root{
    --gris-fonce: #1c1e22;
    --gris-fonce-2: #24272c;
    --gris-clair: #e8e9ec;
    --gris-clair-2: #d3d5da;
    --accent: #7c8aff;
    --texte-clair: #f2f3f5;
    --texte-sombre: #1c1e22;
    --texte-muted: #9a9da5;
    --bord: #33363d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--gris-fonce);
    color: var(--texte-clair);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }

  #app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  /* ============ INTRO VIDÉO ============ */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }
  #intro.fade-out { opacity: 0; pointer-events: none; }
  #intro video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ============ LAYOUT PRINCIPAL ============ */
  #main {
    display: flex;
    height: 100%;
    width: 100%;
  }

  /* ============ SIDEBAR / HAMBURGER MENU ============ */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 78%;
    max-width: 300px;
    background: var(--gris-fonce-2);
    border-right: 1px solid var(--bord);
    transform: translateX(-105%);
    transition: transform 0.28s cubic-bezier(.4,0,.2,1);
    z-index: 200;
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
  }
  #sidebar.open { transform: translateX(0); }

  #sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
  }
  #sidebar-overlay.open { opacity: 1; pointer-events: auto; }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 14px 8px;
  }
  .sidebar-title {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.3px;
    color: var(--texte-clair);
  }

  #new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 14px;
    width: 100%;
  }
  #new-chat-btn:active { opacity: 0.8; }

  /* ============ BOUTON NOUVEAUTÉS (ajout) ============ */
  #news-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--gris-fonce);
    color: var(--gris-clair-2);
    border: 1px solid var(--bord);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 10px;
    width: 100%;
  }
  #news-btn:active { opacity: 0.8; }

  #chat-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    color: var(--gris-clair-2);
    cursor: pointer;
  }
  .chat-item:active { background: rgba(255,255,255,0.06); }
  .chat-item.active {
    background: rgba(124,138,255,0.15);
    color: var(--texte-clair);
  }
  .chat-item-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .chat-item-delete {
    opacity: 0.5;
    font-size: 15px;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .chat-item-delete:active { opacity: 1; }

  .sidebar-footer {
    padding: 10px 8px 4px 8px;
    font-size: 11px;
    color: var(--texte-muted);
    text-align: center;
    border-top: 1px solid var(--bord);
    margin-top: 8px;
  }

  /* ============ ZONE DE CHAT ============ */
  #chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--gris-fonce);
  }

  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--bord);
    background: var(--gris-fonce);
    flex-shrink: 0;
    z-index: 10;
  }

  #hamburger-btn {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--gris-fonce-2);
    border: 1px solid var(--bord);
    padding: 9px 8px;
  }
  #hamburger-btn span {
    display: block;
    height: 2px;
    width: 100%;
    background: var(--gris-clair-2);
    border-radius: 2px;
  }

  #topbar-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--texte-clair);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #topbar-sub {
    font-size: 11.5px;
    color: var(--texte-muted);
    margin-top: 1px;
  }

  /* ============ MESSAGES ============ */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .msg-row {
    display: flex;
    width: 100%;
  }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ia { justify-content: flex-start; }

  .bubble {
    max-width: 80%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.42;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .bubble.user {
    background: var(--gris-clair);
    color: var(--texte-sombre);
    border-bottom-right-radius: 6px;
  }

  .bubble.ia {
    background: var(--gris-fonce-2);
    color: var(--texte-clair);
    border: 1px solid var(--bord);
    border-bottom-left-radius: 6px;
  }

  /* ============ INDICATEUR "RÉFLÉCHIT" ============ */
  .thinking-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 15px 8px 6px;
  }

  .atom-loader {
    position: relative;
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .atom-loader .core {
    position: absolute;
    top: 50%; left: 50%;
    width: 5px; height: 5px;
    margin: -2.5px 0 0 -2.5px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(255,255,255,0.8);
  }
  .atom-loader .orbit {
    position: absolute;
    top: 50%; left: 50%;
    width: 26px; height: 26px;
    margin: -13px 0 0 -13px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;
  }
  .atom-loader .orbit span {
    position: absolute;
    top: -3px; left: 50%;
    width: 6px; height: 6px;
    margin-left: -3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(255,255,255,0.9);
  }
  .atom-loader .orbit.o1 { animation: spin 1.1s linear infinite; }
  .atom-loader .orbit.o2 {
    animation: spin 1.4s linear infinite reverse;
    transform: rotate(60deg);
  }
  .atom-loader .orbit.o3 {
    animation: spin 1.7s linear infinite;
    transform: rotate(120deg);
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .atom-loader .orbit.o2 span, .atom-loader .orbit.o3 span {
    box-shadow: 0 0 4px rgba(255,255,255,0.9);
  }

  .thinking-text {
    font-size: 13.5px;
    color: var(--texte-muted);
    font-style: italic;
  }

  /* ============ ZONE DE SAISIE ============ */
  #input-bar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--gris-fonce);
    border-top: 1px solid var(--bord);
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    background: var(--gris-fonce-2);
    border: 1px solid var(--bord);
    color: var(--texte-clair);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 15px;
    resize: none;
    max-height: 120px;
    line-height: 1.3;
    font-family: inherit;
  }
  #msg-input:focus { outline: none; border-color: var(--accent); }
  #msg-input::placeholder { color: var(--texte-muted); }

  #send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #send-btn:active { opacity: 0.8; }
  #send-btn:disabled { opacity: 0.4; }
  #send-btn svg { width: 19px; height: 19px; }

  /* Empty state */
  #empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    color: var(--texte-muted);
  }
  #empty-state .logo {
    font-size: 26px;
    font-weight: 700;
    color: var(--texte-clair);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  #empty-state p { font-size: 13.5px; max-width: 260px; }

  ::-webkit-scrollbar { width: 0; height: 0; }
    .ai-disclaimer {
    font-size: 11px;
    color: var(--texte-muted);
    margin-top: 6px;
    margin-left: 4px;
    opacity: 0.8;
  }
  /* Popup Nouveautés */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.75);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.active {
  display: flex;
}
.modal-content {
  background: #1e1e2d;
  color: #ffffff;
  border-radius: 14px;
  padding: 20px;
  max-width: 400px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  border-bottom: 1px solid #2d2d42;
  padding-bottom: 8px;
}
.close-btn {
  font-size: 24px;
  cursor: pointer;
  color: #aaa;
}
.news-gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 15px;
}
.news-img-card {
  width: 100%;
  aspect-ratio: 1/1;
  background: #2a2a3c;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed #444;
}
.news-img-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

</style>
</head>
<body>

<div id="app">

  <!-- INTRO VIDEO -->
  <div id="intro">
    <video id="intro-video" autoplay muted playsinline></video>
  </div>

  <div id="main">

    <div id="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Conversations</span>
      </div>
      <button id="news-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        Nouveautés · NEXO 0.1
      </button>
      <button id="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle conversation
      </button>
      <div id="chat-list"></div>
      <div class="sidebar-footer">NEXO · modèle personnel</div>
    </div>

    <!-- CHAT AREA -->
    <div id="chat-area">
      <div id="topbar">
        <button id="hamburger-btn"><span></span><span></span><span></span></button>
        <div>
          <div id="topbar-title">NEXO</div>
          <div id="topbar-sub">toujour prêt à discuté</div>
        </div>
      </div>

      <div id="messages"></div>

      <div id="input-bar">
        <textarea id="msg-input" rows="1" placeholder="Écris un message à NEXO..."></textarea>
        <button id="send-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>

  </div>

  <!-- MODAL NOUVEAUTÉS (ajout) -->
  <div class="modal-overlay" id="news-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="sidebar-title">Nouveautés · NEXO 0.1</span>
        <span class="close-btn" id="news-close-btn" style="border:2px solid #ff4d4d;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#ff4d4d;line-height:1;">×</span>
      </div>
      <p style="font-size:14px;color:#d3d5da;line-height:1.5;">
        nouveauté de la maj 0.1
      </p>
      <div class="news-gallery" style="grid-template-columns:1fr;">
        <div class="news-img-card" style="aspect-ratio:16/9;">
          <img src="https://i.postimg.cc/BvWHNbn3/file-00000000f68881f491bac332085b138a.png" alt="Démo mise à jour">
        </div>
      </div>
    </div>
  </div>

</div>

<script>
(function(){

  // ============================================
  // RÉGLAGES À PERSONNALISER
  // ============================================
  const INTRO_VIDEO_URL = "https://files.catbox.moe/t6zzje.mp4";
  const API_URL = "https://superior-advocacy-someone-forming.trycloudflare.com/chat";
  // ============================================
  const GREETINGS = [
  "Quoi de neuf aujourd’hui ?",
  "Comment puis-je t'aider ?",
  "Prêt à discuter ?",
  "Qu'est-ce qu'on explore aujourd'hui ?",
  "Pose-moi n'importe quelle question !"
];

  const STORAGE_KEY = "nexo_conversations_v1";

  // ---------- Intro vidéo ----------
  const introEl = document.getElementById('intro');
  const introVideo = document.getElementById('intro-video');

  introVideo.src = INTRO_VIDEO_URL;

  function endIntro(){
    introEl.classList.add('fade-out');
    setTimeout(() => { introEl.style.display = 'none'; }, 650);
  }

  // Se termine après 5 secondes, ou à la fin de la vidéo si plus courte. Pas de skip possible.
  const introTimer = setTimeout(endIntro, 5000);
  introVideo.addEventListener('ended', endIntro);
  introVideo.addEventListener('error', () => { clearTimeout(introTimer); endIntro(); });

  // ---------- State ----------
  let conversations = loadConversations();
  let currentChatId = null;

  function loadConversations(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }

  function saveConversations(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  }

  function getCurrentChat(){
    return conversations.find(c => c.id === currentChatId);
  }

  function createNewChat(){
    const chat = {
      id: 'chat_' + Date.now(),
      title: 'Nouvelle conversation',
      messages: [],
      createdAt: Date.now()
    };
    conversations.unshift(chat);
    currentChatId = chat.id;
    saveConversations();
    renderChatList();
    renderMessages();
    closeSidebar();
  }

  function deleteChat(id, evt){
    evt.stopPropagation();
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    if (currentChatId === id) {
      currentChatId = conversations.length ? conversations[0].id : null;
      if (!currentChatId) createNewChat();
    }
    renderChatList();
    renderMessages();
  }

  function selectChat(id){
    currentChatId = id;
    renderChatList();
    renderMessages();
    closeSidebar();
  }

  // ---------- Sidebar ----------
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const hamburgerBtn = document.getElementById('hamburger-btn');

  function openSidebar(){
    sidebar.classList.add('open');
    overlay.classList.add('open');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  }
  hamburgerBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  document.getElementById('new-chat-btn').addEventListener('click', createNewChat);

  function renderChatList(){
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    conversations.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      item.innerHTML = `
        <span class="chat-item-title">${escapeHtml(chat.title)}</span>
        <span class="chat-item-delete">✕</span>
      `;
      item.addEventListener('click', () => selectChat(chat.id));
      item.querySelector('.chat-item-delete').addEventListener('click', (e) => deleteChat(chat.id, e));
      list.appendChild(item);
    });
  }

  // ---------- Messages ----------
  const messagesEl = document.getElementById('messages');
  const topbarTitle = document.getElementById('topbar-title');

  function renderMessages(){
    const chat = getCurrentChat();
    messagesEl.innerHTML = '';

       if (!chat || chat.messages.length === 0) {
      const randomGreeting = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];

      messagesEl.innerHTML = `
        <div id="empty-state">
          <div class="logo">NEXO</div>
          <p>${escapeHtml(randomGreeting)}</p>
        </div>
      `;
      topbarTitle.textContent = 'NEXO';
      return;
    }
 
   topbarTitle.textContent = chat.title;

    chat.messages.forEach(m => {
      appendBubble(m.role, m.content, false);
    });
    scrollToBottom();
  }

    function appendBubble(role, text, scroll=true){
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ia');
    
    const wrapper = document.createElement('div');
    wrapper.style.display = 'flex';
    wrapper.style.flexDirection = 'column';
    wrapper.style.maxWidth = '80%';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'ia');
    bubble.style.maxWidth = '100%';
    bubble.textContent = text;
    wrapper.appendChild(bubble);

    // Si c'est l'IA, on ajoute le petit texte pro en dessous
    if (role === 'ia') {
      const disclaimer = document.createElement('div');
      disclaimer.className = 'ai-disclaimer';
      disclaimer.textContent = "Cette réponse a été générée par de l'IA et peut contenir de nombreuses erreurs.";
      wrapper.appendChild(disclaimer);
    }

    row.appendChild(wrapper);
    messagesEl.appendChild(row);
    if (scroll) scrollToBottom();
  }


  function scrollToBottom(){
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- Indicateur "réfléchit" ----------
  function showThinking(){
    const row = document.createElement('div');
    row.className = 'msg-row ia';
    row.id = 'thinking-row';
    row.innerHTML = `
      <div class="thinking-row">
        <div class="atom-loader">
          <div class="core"></div>
          <div class="orbit o1"><span></span></div>
          <div class="orbit o2"><span></span></div>
          <div class="orbit o3"><span></span></div>
        </div>
        <div class="thinking-text">réfléchit...</div>
      </div>
    `;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function hideThinking(){
    const row = document.getElementById('thinking-row');
    if (row) row.remove();
  }

  // ---------- Modal Nouveautés (ajout) ----------
  const newsBtn = document.getElementById('news-btn');
  const newsModal = document.getElementById('news-modal');
  const newsCloseBtn = document.getElementById('news-close-btn');

  newsBtn.addEventListener('click', () => {
    newsModal.classList.add('active');
  });
  newsCloseBtn.addEventListener('click', () => {
    newsModal.classList.remove('active');
  });
  newsModal.addEventListener('click', (e) => {
    if (e.target === newsModal) newsModal.classList.remove('active');
  });

  // ---------- Envoi de message ----------
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  async function sendMessage(){
    const text = input.value.trim();
    if (!text) return;

    if (!currentChatId) createNewChat();
    let chat = getCurrentChat();

    // Si c'est le premier message, on enlève l'empty state et on nomme le chat
    if (chat.messages.length === 0) {
      messagesEl.innerHTML = '';
      chat.title = text.length > 30 ? text.slice(0, 30) + '...' : text;
    }

    chat.messages.push({ role: 'user', content: text });
    saveConversations();
    renderChatList();

    appendBubble('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    showThinking();

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          history: chat.messages
        })
      });

      if (!response.ok) throw new Error('Erreur API: ' + response.status);

      const data = await response.json();
      const reply = data.reply || data.response || data.message || "(réponse vide)";

      hideThinking();
      appendBubble('ia', reply);

      chat.messages.push({ role: 'ia', content: reply });
      saveConversations();

    } catch (err) {
      hideThinking();
      appendBubble('ia', "⚠️ Impossible de contacter NEXO (" + err.message + "). Vérifie que le serveur local tourne sur " + API_URL);
    } finally {
      sendBtn.disabled = false;
    }
  }

  // ---------- Init ----------
  if (conversations.length === 0) {
    createNewChat();
  } else {
    currentChatId = conversations[0].id;
  }
  renderChatList();
  renderMessages();

})();
</script>

</body>
</html>
